name: Compilación APK Danonino Android (Debug)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '**'

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout del Código Fuente
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Configurar Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 4. Aceptar Licencias de Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: 5. Instalar Dependencias de Node
        run: |
          npm ci || npm install

      - name: 6. Verificación de Tipos TypeScript y Lint
        run: |
          npm run lint

      - name: 7. Compilar Aplicación Web con Vite
        run: |
          npm run build

      - name: 8. Sincronizar Proyecto Nativo Capacitor
        run: |
          npx cap sync android

      - name: 9. Conceder Permisos de Ejecución a Gradle Wrapper
        run: |
          chmod +x android/gradlew

      - name: 10. Compilar APK Debug con Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 11. Verificar Generación del APK
        run: |
          RAW_APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ] || [ ! -f "$RAW_APK" ]; then
            echo "ERROR: El archivo APK no fue generado en android/app/build/outputs/apk/debug"
            exit 1
          fi
          FINAL_APK="android/app/build/outputs/apk/debug/Danonino-Evolution-v2.1.apk"
          cp "$RAW_APK" "$FINAL_APK"
          echo "APK_PATH=$FINAL_APK" >> $GITHUB_ENV
          echo "APK generado exitosamente en: $FINAL_APK"
          ls -la "$FINAL_APK"

      - name: 12. Publicar Artefacto Descargable en GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Danonino-Android-Debug
          path: ${{ env.APK_PATH }}
          retention-days: 14
          if-no-files-found: error

      - name: 13. Publicar Release Pública con APK Directo (Sin Login)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1-debug
          name: Danonino Evolution v2.1 (Debug APK)
          body: |
            Descarga directa de APK Danonino Evolution 2.1 con ONEIROS Living Engine y Memoria Persistente SQLite.
            Instala directamente este archivo .apk en tu dispositivo Android.
          files: ${{ env.APK_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
